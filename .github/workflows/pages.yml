name: Publish wiki

# main/master publish to the root of the gh-pages branch; every pull request
# publishes a preview to pr-preview/pr-N/ and gets a comment with its link.
# The preview is removed when the pull request closes.

on:
  push:
    branches: [main, master]
  pull_request:
    types: [opened, reopened, synchronize, closed]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

# One queue per pull request, and one for the site. A merged pull request's
# "closed" run must not cancel the push run that publishes the site.
concurrency:
  group: pages-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'site' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        if: github.event.action != 'closed'
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
        if: github.event.action != 'closed'
      - run: mkdocs build --strict && touch site/.nojekyll
        if: github.event.action != 'closed'

      - name: Publish the site
        if: github.event_name != 'pull_request'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: site
          clean-exclude: pr-preview/

      - name: Publish the pull request preview
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: rossjrw/pr-preview-action@v1
        with:
          source-dir: site
          preview-branch: gh-pages
          umbrella-dir: pr-preview
