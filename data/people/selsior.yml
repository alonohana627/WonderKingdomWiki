npcs:
  # ---------------------------------------------------------------- Palace
  - id: queen_aveline
    name: Aveline
    title: Queen of Wonder Kingdom
    role: ruler
    office: selsior.monarch
    place: Palace
    age: adult
    personality: "Warm, quick to laugh and very hard to fool. She listens to everyone to the end, then decides in one sentence."
    story: "Crowned under the Great Bell, Aveline believes the crown's task is to keep the kingdom together, not to command it. She keeps a sworn alliance with Cavelor's Keeper of the Oath and trades long, argumentative letters with Urbanograd's Caller of the Open Table. Lately the reports of monsters on the royal roads keep her up at night."
  - id: leofric
    name: Leofric
    title: Queen's Consort
    role: council
    place: Palace
    age: adult
    personality: "Gentle, absent-minded and happiest with ink on his fingers. He forgets supper but never a road."
    story: "Leofric was a road surveyor before he married the queen, and he still keeps a great map of the royal roads on the palace wall. Each week he marks where the patrols met monsters, and he does not like how the marks are spreading."
  - id: elinor
    name: Elinor
    title: Princess of Wonder Kingdom
    role: resident
    place: Palace
    age: young
    personality: "Bold, restless and stubborn as a mule. She hates embroidery and loves anything with a blade or a horse in it."
    story: "Elinor sneaks out at dawn to take sword lessons at the Knights' Court under a borrowed cloak. She wants to pass the Guard's trials like anyone else, and she is terrified her parents will find out before she does."
  - id: alaric
    name: Alaric
    title: Young Prince
    role: child
    place: Palace
    age: child
    personality: "Curious, chatty and always muddy. He asks why about everything and remembers every answer."
    story: "Alaric spends more time in the palace gardens and kitchens than in his lessons. He collects beetles, keys and rumours, and he is sure there is a secret passage behind the throne hall tapestries."
  - id: osbert
    name: Osbert
    title: Royal Steward
    role: official
    place: Palace
    age: elder
    personality: "Precise, dry and secretly sentimental. He can tell how many candles burned last night by sniffing the hall."
    story: "Osbert has run the palace household for more than thirty years and knows where every spoon and every secret is kept. He would like to retire, but he has not found anyone he trusts with the keys."
  - id: melisende
    name: Melisende
    title: Mistress of the Envoys' Hall
    role: official
    place: Palace
    age: adult
    personality: "Polished, patient and fluent in every town's manners. She never raises her voice and never loses an argument."
    story: "Melisende hosts the envoys every town keeps at the palace, and she knows which ones want highland tea, which want sea salt on their bread and which want the windows open. She advises the queen whenever two towns quarrel over trade."
  - id: cuthbert
    name: Cuthbert
    title: Royal Cook
    role: service
    place: Palace
    age: adult
    personality: "Loud, red-faced and generous. He shouts at the pots and sings to the bread."
    story: "Cuthbert cooks for the palace and for every envoy's feast, and he insists on learning each town's dishes properly. His dream is a great harvest feast with one dish from every town on a single table."
  - id: agnes
    name: Agnes
    title: Palace Maid
    role: service
    place: Palace
    age: young
    personality: "Cheerful, nosy and quick on her feet. She hears everything and repeats only half of it."
    story: "Agnes grew up in her father's kitchen and now cleans the upper halls. She has noticed the princess's boots are muddy every morning and has said nothing, yet."
  - id: peterkin
    name: Peterkin
    title: Palace Page
    role: child
    place: Palace
    age: child
    personality: "Eager, breathless and proud of his uniform. He runs everywhere, even when nobody is waiting."
    story: "Peterkin carries messages inside the palace and dreams of becoming a royal courier one day. He practises by racing the clock tower bells from the cellars to the roof."
  - id: godwin
    name: Godwin
    title: Palace Gardener
    role: worker
    place: Palace
    age: elder
    personality: "Slow, patient and full of proverbs. He talks to his roses more than to people."
    story: "Godwin has tended the palace gardens since the old king's day. He grows a cutting from every town's favourite flower, and he worries that the wild bees have turned mean this year."
  - id: petronella
    name: Petronella
    title: Royal Scribe
    role: scholar
    place: Palace
    age: adult
    personality: "Neat, serious and fond of long words. She corrects other people's spelling out of kindness."
    story: "Petronella copies every royal letter and decree into the palace books. She has the best handwriting in the kingdom and a secret ambition to write a history of her own."
  - id: ansel
    name: Ansel
    title: Palace Physician
    role: healer
    place: Palace
    age: elder
    personality: "Calm, gentle and slightly deaf. He treats a queen and a scullery boy with the same cold hands."
    story: "Ansel studied healing at the Scholars' Quarter and has served the palace for decades. More guards come to him with claw wounds every season, and he keeps careful notes on what bit them."
  - id: sybil
    name: Sybil
    title: Royal Wardrobe Mistress
    role: service
    place: Palace
    age: adult
    personality: "Elegant, sharp-tongued and kind underneath. She can judge a person by their hem."
    story: "Sybil keeps the royal family's clothes, from the coronation robes to the princess's riding boots. She lent Elinor the cloak she wears to the Knights' Court and pretends she has no idea where it went."

  # ---------------------------------------------------------------- Royal Vault
  - id: aldous
    name: Aldous
    title: Keeper of the Royal Vault
    role: official
    menu: true
    place: Royal Vault
    age: elder
    game: aldous
    personality: "Courteous, exact and quietly proud. He counts twice and smiles once."
    story: "Aldous has sat at the vault desk for thirty years and boasts that not a coin has gone missing in all that time. He keeps the kingdom's treasures and records, and the belongings of any citizen who asks, and he is fond of reminding travellers that what they leave here can be fetched in any town."
  - id: jocelyn
    name: Jocelyn
    title: Vault Clerk
    role: official
    place: Royal Vault
    age: adult
    personality: "Brisk, organised and impatient with mess. She labels everything, including her lunch."
    story: "Jocelyn learned the vault's ledgers from Aldous and will one day take his desk. She has found an old record box with a missing key, and she cannot stop wondering what is in it."
  - id: wulfric
    name: Wulfric
    title: Vault Warden
    role: guard
    place: Royal Vault
    age: adult
    personality: "Huge, quiet and soft-spoken. He blushes when thanked."
    story: "Wulfric guards the vault doors beneath the palace and has never had to draw his sword there. He married the vault clerk after years of silently carrying her ledgers up the stairs."

  # ---------------------------------------------------------------- Knights' Court
  - id: rhys
    name: Rhys
    title: Captain of the Royal Guard
    role: guard
    office: selsior.guard_captain
    place: Knights' Court
    age: adult
    game: rhys
    personality: "Steady, demanding and fair. He believes a sword is only as good as the arm behind it, and says so often."
    story: "Rhys trains the Guard's warriors in the Swordsman's way and sets the trials for every rank on the road to Swordmaster and beyond. In his youth he trained alongside an Uskari warrior of Midbarium, and he still says no one ever pushed him harder. Since the Age of Disturbance began he has more recruits than ever, and less time to make them ready."
  - id: pim
    name: Pim
    title: Recruit
    role: guard
    place: Knights' Court
    age: young
    game: pim
    personality: "Keen, clumsy and endlessly cheerful. He asks for one more round of drills even when he can barely stand."
    story: "Pim joined the Guard the day he was old enough and salutes everyone, just in case. Captain Rhys says his guard is full of holes, and Pim is determined to close every one of them."
  - id: tobe
    name: Tobe
    title: Recruit
    role: guard
    place: Knights' Court
    age: young
    game: tobe
    personality: "Thoughtful, bookish and a little anxious. He knows the manual by heart and his arms do not."
    story: "Tobe read every book on swordsmanship in the Scholars' Quarter before he came to the Court, and none of them mentioned how heavy swords are. He is still stuck on the third cut."
  - id: avice
    name: Avice
    title: Recruit
    role: guard
    place: Knights' Court
    age: young
    personality: "Fierce, proud and short with words. She trains harder when anyone is watching."
    story: "Avice walked to the capital from the highlands to try the Guard's trials, and she means to be the first of her year to earn the Swordsman's rank. She has noticed that the cloaked stranger who trains at dawn holds a sword like someone raised with fine manners."
  - id: bertrand
    name: Bertrand
    title: Drill Sergeant
    role: guard
    place: Knights' Court
    age: adult
    personality: "Gruff, bellowing and fond of every recruit he shouts at. He has a voice that could crack a shield."
    story: "Bertrand runs the dawn drills and swears he can turn anyone into a guard given a year and enough porridge. He keeps a list of every recruit he has trained and checks it against the patrol reports."
  - id: rowena
    name: Rowena
    title: Swordmaster of the Guard
    role: guard
    place: Knights' Court
    age: adult
    personality: "Cool, precise and sparing with praise. When she smiles, recruits remember it for a week."
    story: "Rowena earned the Swordmaster's rank young and teaches the Court's advanced classes. She agreed to give a cloaked stranger private lessons at dawn without asking her name, and she knows exactly whose daughter she is."
  - id: edric
    name: Edric
    title: Lieutenant of the Road Patrol
    role: guard
    place: Knights' Court
    age: adult
    personality: "Weathered, plain-spoken and tired in a way sleep does not fix. He jokes to keep his patrols calm."
    story: "Edric leads the patrols that ride the royal roads between the towns. Every season there are more monsters and bolder ones, and he wants the Court to train faster than the wilds grow worse."
  - id: helewise
    name: Helewise
    title: Guard Quartermaster
    role: official
    place: Knights' Court
    age: adult
    personality: "Practical, thrifty and unshakeable. She knows how many arrows the Guard has to the last fletching."
    story: "Helewise feeds, arms and clothes the Royal Guard, and she haggles with the Crown Market's armourers as if the gold were her own. Patrols are wearing out boots faster than she can buy them."
  - id: wystan
    name: Wystan
    title: Stablemaster
    role: worker
    place: Knights' Court
    age: elder
    personality: "Grumbling, gentle with animals and rough with people. He trusts a horse's opinion over a captain's."
    story: "Wystan keeps the Guard's horses and has done for forty years. Horses come back from the roads jumpy and wild-eyed lately, and he wants to know what they are smelling out there."
  - id: aylwin
    name: Aylwin
    title: Road Patrol Guard
    role: guard
    place: Knights' Court
    age: young
    personality: "Brave, earnest and easily embarrassed. He writes poems he never shows anyone."
    story: "Aylwin rides with the road patrol and has already fought off a pack of wild boars on the road to Kaldemor. He is sweet on the princess, and she on him, and both of them think nobody knows."
  - id: aubrey
    name: Aubrey
    title: Old Grand Swordmaster
    role: guard
    place: Knights' Court
    age: elder
    personality: "Wry, slow-moving and still frighteningly quick with a blade. He naps in the sun and wakes when a recruit holds a sword wrong."
    story: "Aubrey is the oldest Grand Swordmaster in the Guard and taught Rhys when Rhys was a recruit. He has spent his retirement searching old books for the Sword Saint's test, and he claims to have found a page of it."

  # ---------------------------------------------------------------- Plaza
  - id: perrin
    name: Perrin
    title: Royal Courier
    role: official
    place: Plaza
    age: young
    game: perrin
    personality: "Fast-talking, self-important and always in a hurry. Letters wait for no one, and neither does he."
    story: "Perrin carries the crown's letters to every town, to the highlands, the harbours and even the World Tree. He calls himself the fastest courier in the kingdom and has the blisters to prove it, though the monsters on the roads make him take the long way more often than he admits."
  - id: gideon
    name: Gideon
    title: Retired Herald
    role: resident
    place: Plaza
    age: elder
    game: gideon
    personality: "Booming, nostalgic and a little lonely. He laughs loudest at his own stories."
    story: "Gideon cried the king's news in the plaza for forty years and now lives in a perch above the square, where he can hear every bell in Selsior. Nobody climbs the ladder to hear him any more, and he would dearly love a visitor."
  - id: mirabel
    name: Mirabel
    title: Dancer
    role: performer
    place: Plaza
    age: young
    game: mirabel
    personality: "Dreamy, light-hearted and impossible to hurry. She dances for the pleasure of it, and the coins are a bonus."
    story: "Mirabel dances by the Great Bell every evening and swears she hears it sing at dusk when the wind is kind. The Bell Warden insists it has not rung since the coronation, and the two of them have argued about it, happily, for years."
  - id: clement
    name: Clement
    title: Royal Herald
    role: official
    place: Plaza
    age: adult
    personality: "Nervous in private and magnificent on the steps. He rehearses every proclamation to the pigeons first."
    story: "Clement took over the herald's post when Gideon retired and still feels he is standing in a giant's boots. He climbs the ladder every week to ask the old man's advice and pretends it is only a social call."
  - id: hugh
    name: Hugh
    title: Warden of the Great Bell
    role: guard
    place: Plaza
    age: elder
    personality: "Solemn, stubborn and proud of a duty most people forget. He polishes the bell's dais every morning."
    story: "Hugh guards the Great Bell and tells anyone who asks that it rings only when a monarch is crowned, and for no one else. He has never admitted that on still evenings he sometimes thinks he hears it hum."
  - id: emmeline
    name: Emmeline
    title: Flower Seller
    role: merchant
    menu: true
    place: Plaza
    age: young
    sells: "Flowers, garlands and festival ribbons"
    personality: "Sunny, flirtatious and quick with a compliment. She can sell a posy to a man on his way to buy bread."
    story: "Emmeline sells flowers on the plaza steps and makes the garlands for every festival in the square. She is saving to open a real shop, and she is courting the juggler who performs beside her stall."
  - id: lambert
    name: Lambert
    title: Street Juggler
    role: performer
    place: Plaza
    age: young
    personality: "Showy, cheeky and kind to children. He never drops a ball unless it makes the crowd laugh."
    story: "Lambert learned juggling from a puppeteer on Theatre Row and now draws the biggest crowds in the plaza. He wants to juggle for the queen at the next royal festival."
  - id: piers
    name: Piers
    title: Pie Seller
    role: merchant
    menu: true
    place: Plaza
    age: adult
    sells: "Meat pies, apple pasties and hot cider"
    personality: "Jolly, round and full of gossip. He knows who bought what pie and why."
    story: "Piers sells pies from a cart by the palace steps and claims his recipe is older than the Great Bell. He is raising his daughter alone and hopes she will take over the cart, though she would rather run off with the circus."
  - id: baldwin
    name: Baldwin
    title: Lamplighter
    role: worker
    place: Plaza
    age: elder
    personality: "Quiet, unhurried and fond of the dark hours. He knows every lamp in the city by its flicker."
    story: "Baldwin lights the plaza lamps at dusk and walks the long way home through the old quarters lighting more. He has started leaving extra lamps burning near the city gate, just in case."
  - id: mab
    name: Mab
    title: Pie Seller's Daughter
    role: child
    place: Plaza
    age: child
    personality: "Bold, giggly and fearless. She tries every trick she sees the street performers do."
    story: "Mab helps at her father's pie cart when she has to and practises cartwheels by the Great Bell when she can. She wants to be the most famous performer in Selsior."
  - id: fulke
    name: Fulke
    title: Ballad Singer
    role: performer
    place: Plaza
    age: adult
    personality: "Charming, theatrical and a terrible liar. Every ballad he sings is mostly true."
    story: "Fulke plays the lute for Mirabel's dances and sings ballads of the Balrog War to anyone with a coin. He collects new songs from travellers at the gate and wants to write one that the whole kingdom sings."

  # ---------------------------------------------------------------- Crown Market
  - id: orsa
    name: Dame Orsa
    title: Shopkeeper
    role: merchant
    menu: true
    place: Crown Market
    age: elder
    game: orsa
    sells: "Travel supplies, scrolls home and everything a traveller forgets"
    personality: "Grand, motherly and shrewd. She calls every customer dear and remembers every debt."
    story: "Dame Orsa runs the general store and stocks everything a traveller forgets, from rope to scrolls home. She earned her title long ago for service to the crown and never explains what it was."
  - id: mirel
    name: Mirel
    title: Apothecary
    role: merchant
    menu: true
    place: Crown Market
    age: adult
    game: mirel
    sells: "Potions, tonics and cures"
    personality: "Brisk, enthusiastic and a born salesman. He has a remedy for everything, including bad moods."
    story: "Mirel sells potions to every adventurer heading up the road and tells each one never to leave without a few. Business has never been better, which he finds a little sad."
  - id: vessa
    name: Vessa
    title: Armourer
    role: merchant
    menu: true
    place: Crown Market
    age: adult
    game: vessa
    sells: "Mail, helms and boots, fitted while you wait"
    personality: "Blunt, strong and secretly funny. She tests her armour by hitting it, and sometimes the customer."
    story: "Vessa fits mail, helms and boots while customers wait, and likes to remind them that armour is only heavy until the first hit lands. She and her sister run the two busiest forges in the market and compete over everything."
  - id: maud
    name: Maud
    title: Housekeeper
    role: service
    place: Crown Market
    age: adult
    game: maud
    personality: "Bustling, bossy and warm. She shops like a general on campaign and expects the crowd to mind her baskets."
    story: "Maud keeps house for Dame Orsa and is at the market every dawn for eggs, bread and the best fruit in Selsior. She swears the market opens at dawn and closes only when the stalls run out, and she means to be there for both."
  - id: selene
    name: Selene
    title: Weaponsmith
    role: merchant
    menu: true
    place: Crown Market
    age: adult
    game: selene
    sells: "Swords, axes and blades from the capital's forges"
    personality: "Proud, intense and generous with advice. She talks about steel the way poets talk about the moon."
    story: "Selene forges blades from the capital's own steel and believes a good blade makes the road shorter. She is trying to make a sword light enough for any recruit and strong enough for any monster."
  - id: reynold
    name: Reynold
    title: Warden of the Crown Market
    role: official
    place: Crown Market
    age: adult
    personality: "Harried, honest and allergic to shortcuts. He carries a set of weights and checks everyone's scales."
    story: "Reynold keeps order in the busiest market on Veligor, settling squabbles over stall space and short measures. He caught a pickpocket boy two summers ago and gave him a job instead of a cell."
  - id: margery
    name: Margery
    title: Baker
    role: merchant
    menu: true
    place: Crown Market
    age: adult
    sells: "Bread, buns and honey cakes baked the Kaldemor way"
    personality: "Floury, patient and kind. She gives the stale loaves to the market dog and pretends she dropped them."
    story: "Margery learned to bake in Kaldemor as a girl and brought the recipes back to the capital. Her stall sells out by noon, and she dreams of a bakery big enough to bake through the night."
  - id: silas
    name: Silas
    title: Fishmonger
    role: merchant
    menu: true
    place: Crown Market
    age: adult
    sells: "Fresh fish from both harbours and smoked river eel"
    personality: "Loud, salty and endlessly cheerful. He names every fish he sells."
    story: "Silas buys fish from both harbours' carters and sells it in the market at a shout. Carts arrive late now because of the monsters on the roads, and he has started hiring guards to ride with them."
  - id: isabeau
    name: Isabeau
    title: Cloth Merchant
    role: merchant
    menu: true
    place: Crown Market
    age: adult
    sells: "Highland wool, linen and dyed cloth"
    personality: "Elegant, sharp-eyed and impossible to cheat. She can tell good wool by its smell."
    story: "Isabeau sells highland wool and fine cloth to tailors, theatres and the palace itself. She is planning a festival of colours in the market square and needs a dyer who can make a colour no one has seen."
  - id: rosalind
    name: Rosalind
    title: Herb Seller
    role: merchant
    menu: true
    place: Crown Market
    age: young
    sells: "Healing herbs, teas and seeds from Fairy Forest"
    personality: "Soft-spoken, earnest and full of plant lore. She apologises to herbs before cutting them."
    story: "Rosalind grew up on the edge of the Greenwood and sells herbs that come in from Fairy Forest. Her suppliers say some of the old herb paths are no longer safe to walk."
  - id: jasper
    name: Jasper
    title: Curio Dealer
    role: merchant
    menu: true
    place: Crown Market
    age: adult
    sells: "Urbanograd inventions, gadgets and curiosities"
    personality: "Excitable, talkative and a dreadful salesman. He demonstrates every gadget until it breaks."
    story: "Jasper sells the strange inventions that come in from Urbanograd: clockwork birds, folding lanterns and things nobody can name. He has one box he will not open in public, because he does not know what it does."
  - id: alys
    name: Alys
    title: Cheesemonger
    role: merchant
    menu: true
    place: Crown Market
    age: elder
    sells: "Cheeses from every town and fresh butter"
    personality: "Tart, witty and slow to trust. She lets customers taste only once they have earned it."
    story: "Alys has sold cheese at the same corner for fifty years and outlived three neighbouring stalls. She worries her baker daughter works too hard and tells her so daily."
  - id: kenric
    name: Kenric
    title: Smith's Apprentice
    role: craftsman
    place: Crown Market
    age: young
    personality: "Earnest, sooty and a little clumsy outside the forge. He hums while he hammers."
    story: "Kenric works the bellows and the hammer for Selene and hopes to forge his first sword this winter. He looks after his little brother, whom the market warden once caught picking pockets."
  - id: wat
    name: Wat
    title: Errand Boy
    role: child
    place: Crown Market
    age: child
    personality: "Quick, cheeky and sharper than he looks. He knows every alley shortcut in the city."
    story: "Wat used to pick pockets in the Crown Market until the warden caught him and gave him errands to run instead. He is honest now, mostly, but he still notices every purse that is badly tied."

  # ---------------------------------------------------------------- Selsior Gate
  - id: brann
    name: Brann
    title: Gate Sergeant
    role: guard
    place: Selsior Gate
    age: adult
    game: brann
    personality: "Gruff, watchful and proud of his city. He welcomes everyone and trusts nobody until they have earned it."
    story: "Brann commands the guards at the great gate and greets every traveller off the Royal Road. He likes to say the road is quiet, until it is not, and lately it is not more often than it used to be."
  - id: hollis
    name: Hollis
    title: Gate Guard
    role: guard
    place: Selsior Gate
    age: young
    game: hollis
    personality: "Friendly, chatty and a little too fond of the view. He starts every greeting stern and ends it smiling."
    story: "Hollis stands twelve hours a day at the gate and still likes looking out over the Royal Road. He warns travellers to mind the step, and the Sergeant."
  - id: tilda
    name: Tilda
    title: Taxi Driver
    role: service
    place: Selsior Gate
    age: adult
    game: tilda
    personality: "Breezy, practical and full of road wisdom. She never forgets a route once she has driven it."
    story: "Tilda drives the Selsior cab from the gate stand to any town with a taxi stand, though only to towns her passengers have walked to before. She never drives into the wilds, and lately she says that rule has never seemed wiser."
  - id: biscuit
    name: Biscuit
    title: Gate Dog
    role: animal
    place: Selsior Gate
    age: adult
    game: biscuit
    personality: "Friendly, greedy and convinced every traveller has bread. He wags what he has of a tail at everyone."
    story: "Biscuit turned up at the gate one winter and the guards never managed to send him away. He sleeps by the gatehouse, follows his nose to the Crown Market every morning and comes back smelling of bread."
  - id: hamon
    name: Hamon
    title: Keeper of the Gate Inn
    role: service
    place: Selsior Gate
    age: adult
    personality: "Hearty, nosy and a natural host. He greets guests by name on their second visit."
    story: "Hamon runs the inn beside the gate, the first and last bed most travellers see in Selsior. He hears every road story first, and lately he keeps a board of them by the door for travellers to read."
  - id: swithin
    name: Swithin
    title: Gate Clerk
    role: official
    place: Selsior Gate
    age: elder
    personality: "Fussy, precise and secretly romantic. He writes down every traveller and imagines their adventures."
    story: "Swithin records who comes and goes through the great gate, and has done since before Brann was a recruit. He has noticed that fewer travellers come in on foot these days, and more come in hurt."
  - id: merrick
    name: Merrick
    title: Caravan Master
    role: worker
    place: Selsior Gate
    age: adult
    personality: "Loud, calculating and loyal to his crew. He prices danger like any other cargo."
    story: "Merrick leads trade caravans between the capital and the other towns. He is always looking for capable fighters to guard his wagons, and he pays well, because he has to."

  # ---------------------------------------------------------------- Theatre Row
  - id: lavinia
    name: Lavinia
    title: Mistress of the Gilded Stage
    role: performer
    place: Theatre Row
    age: elder
    personality: "Grand, theatrical and ruthless about box-office takings. She treats every conversation as a performance."
    story: "Lavinia owns the Gilded Stage, the oldest theatre on Theatre Row, and once played every great part in it. She wants one last triumph before she hands it on, and she has bet everything on a new play."
  - id: crispin
    name: Crispin
    title: Playwright
    role: performer
    place: Theatre Row
    age: adult
    personality: "Anxious, witty and always scribbling. He talks in half-finished lines."
    story: "Crispin is writing a grand play about the Balrog War for the Gilded Stage, and he cannot decide how it should end. The historians tell him nobody knows what the Balrog truly is, which he finds very unhelpful."
  - id: rosamund
    name: Rosamund
    title: Leading Lady
    role: performer
    place: Theatre Row
    age: adult
    personality: "Radiant, vain and fiercely loyal. She can cry on cue and laugh at herself off stage."
    story: "Rosamund is the most famous actress in Selsior and the playwright's wife. She is determined to play the Magician, who stands for all the Magicians who wove the seal, in his new play, and she will not share the stage with Percival in it."
  - id: percival
    name: Percival
    title: Leading Man
    role: performer
    place: Theatre Row
    age: adult
    personality: "Dashing, pompous and a better actor than person, though he is working on it."
    story: "Percival has played every hero on Theatre Row and wants to play the Savage warrior who stands for the whole front line that held the Balrog at the Tree. He and Rosamund have quarrelled on and off stage for ten years, and audiences love it."
  - id: edith
    name: Edith
    title: Costumer
    role: craftsman
    place: Theatre Row
    age: elder
    personality: "Thrifty, patient and full of pins. She can make a king's robe from curtains."
    story: "Edith sews every costume on Theatre Row from cloth she haggles out of the Crown Market. Her sister dresses the royal family, and the two of them trade gossip about who wore what."
  - id: rafe
    name: Rafe
    title: Puppeteer
    role: performer
    place: Theatre Row
    age: adult
    personality: "Quiet, clever and more expressive with his hands than his face. He speaks best through his puppets."
    story: "Rafe runs a puppet show for the children of Theatre Row and taught the plaza's juggler his first tricks. His puppet Balrog is so frightening he has had to make it smaller twice."
  - id: tibb
    name: Tibb
    title: Stagehand
    role: worker
    place: Theatre Row
    age: young
    personality: "Wiry, unflappable and sarcastic. He knows every trapdoor and rope in the theatre."
    story: "Tibb works the ropes and trapdoors of the Gilded Stage and keeps the actors from killing each other. He is sweet on the Old Quarter's rat catcher and brings her the theatre's mice."
  - id: marigold
    name: Marigold
    title: Child Actor
    role: child
    place: Theatre Row
    age: child
    personality: "Precocious, dramatic and very sure of herself. She knows everyone's lines better than they do."
    story: "Marigold is the daughter of the playwright and the leading lady, and she has been on stage since she could walk. She wants a part in the new play and is not above blackmail to get it."
  - id: cecily
    name: Cecily
    title: Singer
    role: performer
    place: Theatre Row
    age: young
    personality: "Shy off stage and fearless on it. Her voice is bigger than she is."
    story: "Cecily came from a fishing village on the coast and sings between the acts at the Gilded Stage. She is learning old ballads from a plaza singer and dreams of singing at a royal feast."

  # ---------------------------------------------------------------- Scholars' Quarter
  - id: bartholomew
    name: Bartholomew
    title: Master of the Royal Academy
    role: scholar
    place: Scholars' Quarter
    age: elder
    personality: "Grandfatherly, rambling and sharp as a tack beneath it. He answers questions with better questions."
    story: "Bartholomew heads the Royal Academy, the school founded by the city's first Magicians. He welcomes students from every town and is proud that no two of them think alike."
  - id: morwen
    name: Morwen
    title: Teacher of Magic
    role: scholar
    place: Scholars' Quarter
    age: adult
    personality: "Intense, precise and impatient with showing off. She believes magic is mostly patience."
    story: "Morwen teaches young mages at the Academy and comes from an old Magician family. She studies the old seal-craft from the Balrog War in the hope that someone will one day need it."
  - id: benedict
    name: Benedict
    title: Head Librarian
    role: scholar
    place: Scholars' Quarter
    age: elder
    personality: "Hushed, fussy and passionately helpful. He can find any book except the one he lost himself."
    story: "Benedict keeps the Academy's great library and taught half the scribes in the palace. He has been searching for years for a missing volume of the Aristocrat war chronicles."
  - id: thomasin
    name: Thomasin
    title: Historian of the Balrog War
    role: scholar
    place: Scholars' Quarter
    age: adult
    personality: "Earnest, careful and quick to say what nobody knows. She hates a good story that is not true."
    story: "Thomasin compares the four peoples' accounts of the Balrog War and refuses to call any one of them right. Lately she has been asked to lecture far more often, and she does not like why."
  - id: gervase
    name: Gervase
    title: Cartographer
    role: scholar
    place: Scholars' Quarter
    age: adult
    personality: "Restless, chatty and allergic to blank spaces on maps. He paces when he thinks."
    story: "Gervase draws the kingdom's maps and surveyed the royal roads alongside the queen's consort when they were both young. He is making a new map of where monsters have been seen, and it is getting crowded."
  - id: theobald
    name: Theobald
    title: Stargazer
    role: scholar
    place: Scholars' Quarter
    age: elder
    personality: "Dreamy, nocturnal and absent-minded. He talks to the stars as if they owe him money."
    story: "Theobald watches the sky from a tower in the Scholars' Quarter and keeps charts going back sixty years. He buys every curious lens the market sells and is building a telescope larger than his tower."
  - id: mariota
    name: Mariota
    title: Academy Student
    role: scholar
    place: Scholars' Quarter
    age: young
    personality: "Bright, impatient and argumentative. She has opinions on everything and evidence for half of them."
    story: "Mariota studies the stars and the old histories at the Academy and teases her brother at the Knights' Court for reading about swords instead of using them. She wants to be the first to explain why the monsters changed."
  - id: everard
    name: Everard
    title: Academy Student
    role: scholar
    place: Scholars' Quarter
    age: young
    personality: "Lazy, charming and secretly brilliant. He sleeps through lectures and passes every exam."
    story: "Everard came to the Academy from a harbour town and spends more time on Theatre Row than in class. His teacher is convinced he could be a great mage if he tried, which is exactly what he is afraid of."
  - id: prudence
    name: Prudence
    title: Alchemist
    role: craftsman
    place: Scholars' Quarter
    age: adult
    sells: "Alchemical reagents, inks and powders"
    personality: "Methodical, prickly and proud. Her eyebrows have grown back twice."
    story: "Prudence brews reagents and inks for the Academy and insists her tonics are better than anything sold in the market. She is trying to brew a potion that heals in a moment, and her neighbours are trying to get her moved."
  - id: ermengarde
    name: Ermengarde
    title: Bookbinder
    role: craftsman
    place: Scholars' Quarter
    age: elder
    personality: "Placid, careful and fond of terrible puns. She smells of glue and old leather."
    story: "Ermengarde mends and binds the Academy's books in a tiny shop beside the library. She once found a letter sewn inside an old binding and has never told anyone what it said."

  # ---------------------------------------------------------------- Old Quarter
  - id: joan
    name: Joan
    title: Keeper of the Crooked Lantern
    role: service
    place: Old Quarter
    age: adult
    personality: "Brisk, big-hearted and hard to fool. She runs her tavern like a ship and her lodgers like a family."
    story: "Joan keeps the Crooked Lantern, a tavern in the old quarters where adventurers rent rooms cheap. She grew up on her father's stories of the road and worries every time her lodgers head out of the gate."
  - id: simkin
    name: Simkin
    title: Cobbler
    role: craftsman
    place: Old Quarter
    age: elder
    sells: "Boots, shoes and repairs"
    personality: "Grumpy, chatty and soft at heart. He judges people by their soles."
    story: "Simkin has mended shoes in the same narrow lane for fifty years. Adventurers wear out their boots so fast these days that he has taken on more work than his old hands can manage."
  - id: gytha
    name: Gytha
    title: Washerwoman
    role: worker
    place: Old Quarter
    age: adult
    personality: "Tough, sharp-tongued and quick to laugh. She can scrub a stain and a reputation clean."
    story: "Gytha runs the washing yard in a courtyard of the old quarters and knows every household's linen and secrets. She is raising her son with her parents' help and wants him to learn a trade, not a sword."
  - id: gilbert
    name: Gilbert
    title: Candlemaker
    role: craftsman
    place: Old Quarter
    age: adult
    sells: "Candles, lamp oil and wax seals"
    personality: "Mild, methodical and very fond of bees. He hums at the same pitch as his hives."
    story: "Gilbert makes candles from his own beeswax on a rooftop above the old quarters. His bees have turned short-tempered this year, and he is not the only beekeeper who says so."
  - id: winifred
    name: Winifred
    title: Storyteller of the Old Quarter
    role: resident
    place: Old Quarter
    age: elder
    personality: "Twinkling, mischievous and endlessly patient with children. She tells the same story differently every time."
    story: "Winifred tells stories on her doorstep every evening, and half the children of the old quarters grew up on them. She knows all four peoples' tales of the Balrog and refuses to say which she believes."
  - id: dickon
    name: Dickon
    title: Skywalk Carpenter
    role: craftsman
    place: Old Quarter
    age: adult
    personality: "Fearless, cheerful and a little reckless. He whistles while hanging over thin air."
    story: "Dickon builds and mends the skywalks that cross above the old quarters' streets. He wants to build one long enough to cross from the old quarters to Theatre Row without touching the ground."
  - id: edwina
    name: Edwina
    title: Midwife
    role: healer
    place: Old Quarter
    age: elder
    personality: "Calm, blunt and unshockable. She has delivered half the old quarters and scolds them all."
    story: "Edwina has brought more babies into Selsior than anyone alive and treats the old quarters' cuts and fevers too. She keeps a list of every child she delivered and turns up at their weddings uninvited."
  - id: hodge
    name: Hodge
    title: Lane Child
    role: child
    place: Old Quarter
    age: child
    personality: "Adventurous, sneaky and loyal to his friends. He climbs anything that holds still."
    story: "Hodge runs wild across the rooftops and skywalks of the old quarters. He wants to join the Royal Guard, which his mother has forbidden, so he trains with a broom handle in secret."
  - id: roland
    name: Roland
    title: Retired Adventurer
    role: adventurer
    place: Old Quarter
    age: elder
    personality: "Gravelly, boastful and kinder than he lets on. He has a scar for every story and a story for every scar."
    story: "Roland adventured across Veligor in his youth, when the wilds were far quieter than they are now. He sits in his daughter's tavern giving advice to young adventurers, and he wishes his knees would let him go with them."
  - id: ida
    name: Ida
    title: Night Watchwoman
    role: guard
    place: Old Quarter
    age: adult
    personality: "Watchful, dry and unafraid of the dark. She knows the old quarters by sound alone."
    story: "Ida walks the old quarters' lanes each night for the Royal Guard, with a lantern and a stout stick. She has heard something scratching under the old drains that she cannot explain."
  - id: lettice
    name: Lettice
    title: Rat Catcher
    role: worker
    place: Old Quarter
    age: young
    personality: "Cheerful, grubby and proud of her trade. She knows the old quarters' cellars better than anyone."
    story: "Lettice clears rats from cellars and drains with her traps and her terrier. The rats in the old drains have grown bigger and bolder lately, and she has started charging double for the deep tunnels."
  - id: thurstan
    name: Thurstan
    title: Adventurer
    role: adventurer
    place: Old Quarter
    age: young
    personality: "Brash, brave and always hungry. He charges first and plans later."
    story: "Thurstan lodges at the Crooked Lantern and takes every bounty posted at the gate. He wants to make a name for himself before the Guard takes all the good monsters."
  - id: constance
    name: Constance
    title: Adventurer
    role: adventurer
    place: Old Quarter
    age: young
    personality: "Cool-headed, studious and dryly funny. She plans every fight and is annoyed when it does not go to plan."
    story: "Constance trained as a mage at the Academy before she chose the road over the classroom. She keeps her partner alive and keeps notes on every monster they fight, in case anyone ever wants to know why they changed."

  # ---------------------------------------------------------------- Riverside
  - id: osmund
    name: Osmund
    title: Ferryman
    role: worker
    place: Riverside
    age: elder
    personality: "Silent, weathered and wise about water. He speaks mostly in nods."
    story: "Osmund has poled the ferry across the river since he was a boy. He has seen things moving in the deep water that were not there before, and he no longer crosses after dark."
  - id: agatha
    name: Agatha
    title: River Fisher
    role: worker
    place: Riverside
    age: adult
    personality: "Tough, practical and cheerful in any weather. She can gut a fish and an argument in one stroke."
    story: "Agatha fishes the river with her father's old nets and sells the catch to her husband's stall in the Crown Market. Her nets have been coming up torn lately, and not by any fish she knows."
  - id: hereward
    name: Hereward
    title: Miller
    role: craftsman
    place: Riverside
    age: adult
    sells: "Flour, meal and bran"
    personality: "Steady, dusty and slow to anger. He measures his words like flour."
    story: "Hereward runs the great water mill that grinds flour for half the city. He would like the mill wheel rebuilt before winter and cannot afford it alone."
  - id: hawise
    name: Hawise
    title: Dyer
    role: craftsman
    place: Riverside
    age: adult
    personality: "Bright, impulsive and stained to the elbows. She talks about colours the way others talk about friends."
    story: "Hawise dyes cloth on the riverbank in vats of every colour, and her husband the miller complains the river runs purple on Tuesdays. She is trying to make a new colour for the cloth merchant's festival."
  - id: bennet
    name: Bennet
    title: Boatwright
    role: craftsman
    personality: "Patient, wry and proud of his joinery. He can tell a boat's age by knocking on it."
    place: Riverside
    age: adult
    story: "Bennet builds and mends the river boats and barges. He is designing a faster barge for the river trade and needs someone brave enough to test it."
  - id: robin
    name: Robin
    title: Mudlark
    role: child
    place: Riverside
    age: child
    personality: "Curious, muddy and full of treasure. He thinks every shiny thing is a lost crown."
    story: "Robin combs the riverbank at low water for things people have dropped, and sells the best to the curio dealer. He found an old badge with a seal no one recognises and keeps it under his pillow."
  - id: lucan
    name: Lucan
    title: Bargemaster
    role: worker
    place: Riverside
    age: adult
    personality: "Booming, sociable and fond of a wager. He knows every bend of the river and every tavern on it."
    story: "Lucan runs barges of grain, stone and timber up and down the river. River travel has become popular now that the roads are dangerous, and he cannot hire bargehands fast enough."
  - id: aldith
    name: Aldith
    title: Herb Wife of the Riverside
    role: healer
    place: Riverside
    age: elder
    personality: "Earthy, warm and stubborn about old remedies. She swears by river mint for everything."
    story: "Aldith treats the riverside folk with herbs from her own garden, while her brother serves as the palace physician. They argue cheerfully about whose cures work best and secretly swap recipes."
  - id: tristan
    name: Tristan
    title: River Scout
    role: adventurer
    place: Riverside
    age: adult
    personality: "Quiet, quick and confident on water and land. He would rather track a beast than fight it."
    story: "Tristan scouts the river and its banks for the barges, warning them where creatures lurk. His brother leads the road patrol, and the two of them compare notes on how the wilds are changing."
  - id: tancred
    name: Tancred
    title: Retired Drain-Mender
    role: resident
    place: Old Quarter
    age: elder
    personality: Gruff, patient and fond of a long silence, he knows the city by its smells and its echoes. He trusts a lantern more than a map.
    story: Tancred worked the old drains under the Old Quarter for thirty years beside Ida's father, and knows the cisterns better than any map. He keeps the old grating in Steps Lane, and lately he does not like what he hears beneath it.

